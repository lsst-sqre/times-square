version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "America/New_York"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "America/New_York"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # Python minor/major bumps are deliberate migrations (uv pin, mypy,
      # CI), and Dependabot's docker pre-release heuristics leak PEP 440
      # beta tags (e.g. 3.15.0b3); restricting to patch updates covers both.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
